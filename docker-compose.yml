services:
  db:
    image: postgis/postgis:16-3.4
    container_name: petjada-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petjada}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petjada}
      POSTGRES_DB: ${POSTGRES_DB:-petjada}
    # Publicat només per al desenvolupament local (pnpm dev:api). En producció
    # es pot lligar a localhost: POSTGRES_BIND=127.0.0.1
    ports:
      - "${POSTGRES_BIND:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - petjada-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petjada} -d ${POSTGRES_DB:-petjada}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: petjada-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 7275
      DATABASE_URL: postgres://${POSTGRES_USER:-petjada}:${POSTGRES_PASSWORD:-petjada}@db:5432/${POSTGRES_DB:-petjada}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # URL pública de la PWA: l'enllaç màgic del correu hi redirigeix.
      APP_URL: ${APP_URL:-http://localhost:7274}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-${VITE_MAPBOX_TOKEN:-}}
      JWT_SECRET: ${JWT_SECRET:-canvia-aixo-en-produccio}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-30}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-petjada_refresh}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LOGIN_TOKEN_TTL_MIN: ${LOGIN_TOKEN_TTL_MIN:-15}
      LOGIN_CODE_MAX_ATTEMPTS: ${LOGIN_CODE_MAX_ATTEMPTS:-5}
      AUTH_RATE_LIMIT_PER_MIN: ${AUTH_RATE_LIMIT_PER_MIN:-10}
      AUTH_RATE_LIMIT_LIGHT_PER_MIN: ${AUTH_RATE_LIMIT_LIGHT_PER_MIN:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Petjada <no-reply@petjada.app>}
      CAPTURE_RADIUS_M: ${CAPTURE_RADIUS_M:-18}
      MAX_CAPTURE_ACCURACY_M: ${MAX_CAPTURE_ACCURACY_M:-30}
      MAX_WALKING_SPEED_MPS: ${MAX_WALKING_SPEED_MPS:-4}
      OBJECT_SPACING_M: ${OBJECT_SPACING_M:-250}
      NEARBY_RADIUS_M: ${NEARBY_RADIUS_M:-10000}
      COMPLETION_COVERAGE: ${COMPLETION_COVERAGE:-0.9}
      COVERAGE_BUFFER_M: ${COVERAGE_BUFFER_M:-20}
      TURNAROUND_RADIUS_M: ${TURNAROUND_RADIUS_M:-30}
      BONUS_POINTS_PER_KM: ${BONUS_POINTS_PER_KM:-20}
      WALKING_DETOUR_FACTOR: ${WALKING_DETOUR_FACTOR:-1.3}
      AUTO_ROUTE_CANDIDATES: ${AUTO_ROUTE_CANDIDATES:-6}
      OBJECT_BASE_POINTS: ${OBJECT_BASE_POINTS:-10}
      OBJECT_POINTS_PER_STEP: ${OBJECT_POINTS_PER_STEP:-2}
      OBJECT_POINTS_STEP_M: ${OBJECT_POINTS_STEP_M:-100}
    # Port lliure al servidor (el 3000 ja hi és ocupat). El proxy invers hi envia /api.
    ports:
      - "${API_PORT:-7275}:7275"
    command: sh -c "node dist/migrate.js && node dist/seed.js && node dist/main.js"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_ENABLE_SIM: ${VITE_ENABLE_SIM:-false}
        VITE_CAPTURE_RADIUS_M: ${VITE_CAPTURE_RADIUS_M:-}
        VITE_VISIBILITY_RANGE_M: ${VITE_VISIBILITY_RANGE_M:-}
        VITE_CAMERA_FOV_DEG: ${VITE_CAMERA_FOV_DEG:-}
        VITE_MIN_ACCURACY_M: ${VITE_MIN_ACCURACY_M:-}
        VITE_MAX_WALKING_SPEED_MPS: ${VITE_MAX_WALKING_SPEED_MPS:-}
        VITE_LOCK_ANGLE_DEG: ${VITE_LOCK_ANGLE_DEG:-}
        VITE_UNLOCK_ANGLE_DEG: ${VITE_UNLOCK_ANGLE_DEG:-}
        VITE_LOCK_HOLD_MS: ${VITE_LOCK_HOLD_MS:-}
        VITE_MOVING_RATE_DPS: ${VITE_MOVING_RATE_DPS:-}
        VITE_NEARBY_RADIUS_M: ${VITE_NEARBY_RADIUS_M:-}
    container_name: petjada-web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-7274}:80"

volumes:
  petjada-pgdata:
